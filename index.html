:root{--bg:#F4F6FA;--panel:#fff;--ink:#003087;--muted:#5A6B8C;--line:#DCE3EF;--accent:#00CC99;--btn:#003087;--btnInk:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000030;--panel:#0B1450;--ink:#fff;--muted:#94DBFF;--line:#22306E;--btn:#00CC99;--btnInk:#000030}}
:root[data-theme="dark"]{--bg:#000030;--panel:#0B1450;--ink:#fff;--muted:#94DBFF;--line:#22306E;--btn:#00CC99;--btnInk:#000030}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:AlexM,AlexL,"Segoe UI",Tahoma,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 40px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
h1{font-size:1.5rem;margin:0 0 6px;font-weight:500}
p.sub{margin:0 0 22px;color:var(--muted);font-family:AlexL,sans-serif;line-height:1.7;font-size:.95rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-size:.9rem;margin-bottom:8px}
input{width:100%;font:inherit;font-size:1.15rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{margin-top:16px;width:100%;font:inherit;font-size:1rem;padding:13px;border:0;border-radius:10px;background:var(--btn);color:var(--btnInk);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.hint{margin-top:12px;font-size:.82rem;color:var(--muted);font-family:AlexL,sans-serif;line-height:1.6;min-height:1.3em}
.bar{height:3px;width:60px;background:var(--accent);margin:0 0 18px;border-radius:2px}
.preview img{width:100%;max-width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 10px 30px rgba(0,48,135,.12)}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),nm=document.getElementById('nm'),out=document.getElementById('out'),dl=document.getElementById('dl'),hint=document.getElementById('hint');
let ready=false,downloads=null;
function draw(){
 if(!ready)return;
 ctx.clearRect(0,0,1080,1080);ctx.drawImage(base,0,0,1080,1080);
 const t=nm.value.trim()||'[ الاسم ]';
 ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#003087';
 let s=84;do{ctx.font='300 '+s+'px AlexL';s-=2}while(ctx.measureText(t).width>760&&s>36);
 ctx.fillText(t,540,715);
 out.src=cv.toDataURL('image/png');
 dl.disabled=!nm.value.trim()||!downloads;
}
Promise.all([new Promise(r=>base.complete?r():base.onload=r),document.fonts.load('300 84px AlexL'),document.fonts.load('500 20px AlexM')]).then(()=>{ready=true;draw()});
nm.addEventListener('input',draw);
const inClaude=!!(window.claude&&window.claude.use);
(async()=>{if(inClaude){try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}
 if(!downloads){dl.style.display='none';hint.textContent='لحفظ البطاقة: اضغط مطولًا على الصورة أو انقر عليها بالزر الأيمن واختر حفظ.'}}
 else{downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}}}
 draw()})();
dl.addEventListener('click',()=>{
 const name=nm.value.trim();if(!name)return;
 cv.toBlob(async b=>{try{await downloads.save({filename:'عيد-ميلاد-'+name.replace(/\s+/g,'-')+'.png',data:b});hint.textContent='تم الحفظ.'}
 catch(e){hint.textContent=e&&e.code==='declined'?'':'تعذر التحميل هنا، اضغط مطولًا على الصورة لحفظها.'}},'image/png');
});
</script></body></html>
